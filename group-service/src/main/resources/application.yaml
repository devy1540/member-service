spring:
  application:
    name: group-service
  datasource:
    url: "jdbc:h2:mem:groupdb;DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
  exposed:
    generate-ddl: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  main:
    banner-mode: "off"

app:
  sample-data:
    enabled: ${APP_SAMPLE_DATA_ENABLED:true}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [${spring.application.name}] [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n%wEx"
  file:
    name: "${LOG_DIR:logs}/${spring.application.name}.jsonl"
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
